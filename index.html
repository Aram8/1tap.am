<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1tap.am — Smart NFC Tapping Cards</title>

  <!-- SEO & Social Meta Tags -->
  <meta name="description"
    content="1tap.am — Smart NFC tapping cards for restaurants, cafes, and personal use. Coming soon to the Global network.">
  <meta property="og:title" content="1tap.am — Smart NFC Tapping Cards">
  <meta property="og:description" content="Already near you. Coming soon to the Global network.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://1tap.am">

  <!-- Modern Minimalist Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%230ea5e9'/><stop offset='50%25' stop-color='%2306b6d4'/><stop offset='100%25' stop-color='%2314b8a6'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='%230f172a'/><path d='M30 50 A 20 20 0 0 1 70 50' stroke='url(%23g)' stroke-width='8' fill='none' stroke-linecap='round'/><path d='M38 58 A 12 12 0 0 1 62 58' stroke='url(%23g)' stroke-width='7' fill='none' stroke-linecap='round'/><circle cx='50' cy='66' r='4' fill='%2306b6d4'/></svg>">
</head>

<body>

  <!-- Ambient Ocean Tide Gradient Glow (Subtle & Quiet) -->
  <div class="ambient-glow orb-1" aria-hidden="true"></div>
  <div class="ambient-glow orb-2" aria-hidden="true"></div>
  <div class="tide-mesh" aria-hidden="true"></div>

  <!-- Single Screen Viewport (Strictly Unscrollable) -->
  <main class="page-container">

    <!-- Main Content Grid -->
    <div class="hero-split">

      <!-- LEFT COLUMN: Minimalist Brand & Actions -->
      <section class="left-hero">

        <!-- 1. BIG LOGO (Placeholder: drop your logo into assets/logo.jpg or swap the file name) -->
        <div class="brand-logo-container" id="brand-logo">
          <img src="assets/1tap.png" alt="1tap.am Logo" class="brand-logo-img" id="main-brand-logo">
        </div>

        <!-- 2. "ALREADY NEAR YOU AT" & SOCIAL MEDIA BUTTONS -->
        <div class="already-section">
          <p class="already-label">Already near you at</p>

          <div class="social-button-row">
            <!-- INSTAGRAM -->
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-btn instagram-btn"
              id="link-instagram" aria-label="Instagram">
              <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
              </svg>
              <span>Instagram</span>
            </a>

            <!-- LINKEDIN -->
            <a href="https://www.linkedin.com/company/1taparmenia/" target="_blank" rel="noopener noreferrer"
              class="social-btn linkedin-btn" id="link-linkedin" aria-label="LinkedIn">
              <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
              </svg>
              <span>LinkedIn</span>
            </a>

            <!-- WHATSAPP -->
            <a href="https://whatsapp.com" target="_blank" rel="noopener noreferrer" class="social-btn whatsapp-btn"
              id="link-whatsapp" aria-label="WhatsApp">
              <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z" />
              </svg>
              <span>WhatsApp</span>
            </a>
          </div>
        </div>

        <!-- 3. "COMING SOON TO THE GLOBAL NETWORK..." (Slides from left to right ONCE and stops) -->
        <div class="coming-soon-wrapper">
          <div class="coming-soon-slide-in">
            <span class="slide-headline">
              Coming soon to the <span class="gradient-text">Global network</span>...
            </span>
          </div>
        </div>

        <!-- 4. EMAIL INPUT FOR CONTACT -->
        <div class="contact-form-section">
          <form class="email-contact-form" id="contact-form">
            <div class="input-group">
              <input type="email" id="contact-email" placeholder="Enter your email to connect..." required
                autocomplete="email">
              <button type="submit" class="submit-btn" id="contact-btn">
                <span>Contact Us</span>
              </button>
            </div>
            <div class="form-feedback" id="contact-feedback"></div>
          </form>
        </div>

      </section>

      <!-- RIGHT COLUMN: Minimalist Luxury NFC Card Showcase (Same animations, way more minimal design) -->
      <section class="right-visual" aria-hidden="false">
        <div class="nfc-stage" id="nfc-card-stage">

          <!-- Subtle Glow Halo -->
          <div class="card-halo-glow"></div>

          <!-- Minimalist 3D Luxury NFC Card -->
          <div class="nfc-card-3d" id="card-element">
            <div class="card-glass-specular"></div>
            <div class="card-hologram-mesh"></div>

            <div class="card-inner">
              <!-- Top Row: Minimalist Contactless Waves -->
              <div class="card-top-row">
                <div class="card-minimal-chip"></div>
                <div class="contactless-symbol" title="NFC Contactless">
                  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <path d="M8.5 16.5a5 5 0 0 1 0-9" />
                    <path d="M12 19a8.5 8.5 0 0 0 0-14" />
                    <path d="M15.5 21.5a12 12 0 0 0 0-19" />
                  </svg>
                </div>
              </div>

              <!-- Center/Bottom: Pure Minimalist 1tap.am Typography -->
              <div class="card-bottom-row">
                <div class="card-brand-minimal">
                  <span class="card-title">1tap<span class="dot">.am</span></span>
                </div>
              </div>
            </div>

            <!-- Tap Wave Ripple -->
            <div class="tap-ripple-effect" id="tap-ripple"></div>

            <!-- Minimal Tap Toast -->
            <div class="tap-popup-toast" id="tap-toast">
              <span class="toast-dot"></span>
              <span>1tap.am connected</span>
            </div>

          </div>

        </div>
      </section>

    </div>

    <!-- Minimalist Footer (Only All Rights Reserved) -->
    <footer class="bottom-bar">
      <span>&copy; <span id="year"></span> 1tap.am. All rights reserved.</span>
    </footer>

  </main>

  <!-- Application Logic -->
  <script src="main.js"></script>
</body>

</html>
